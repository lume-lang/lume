[package]
name = "lume_session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
test = false
doctest = false

[dependencies]
lume_errors = { workspace = true }
lume_errors_derive = { workspace = true }
lume_hash = { workspace = true }
lume_options = { workspace = true }
lume_span = { workspace = true }

indexmap = { workspace = true, features = ["serde"] }
lume_architect = { workspace = true }
rust-embed = { version = "=8.7.0", features = [
    "interpolate-folder-path",
    "include-exclude",
] }
semver = { version = "^1", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
